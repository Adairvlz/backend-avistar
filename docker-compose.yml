services:
  backend:
    build: .
    container_name: avistar_backend
    ports:
      - "8010:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: avistar_db
    environment:
      POSTGRES_DB: avistar_db
      POSTGRES_USER: avistar_user
      POSTGRES_PASSWORD: avistar_password
    ports:
      - "5428:5432"
    volumes:
      - avistar_pgdata:/var/lib/postgresql/data

volumes:
  avistar_pgdata: